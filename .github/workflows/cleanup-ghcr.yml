name: Cleanup GHCR production images

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report deletion candidates without deleting them
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: cleanup-ghcr-production-images
  cancel-in-progress: false

jobs:
  cleanup:
    name: Retain production and recent candidates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Clean old tagged package versions
        env:
          GH_TOKEN: ${{ github.token }}
          LEVI_GHCR_CLEANUP_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          LEVI_GHCR_RETENTION_DAYS: "7"
          LEVI_PRODUCTION_DEPLOYMENT_JSON: ${{ vars.LEVI_PRODUCTION_DEPLOYMENT }}
        run: bash scripts/cleanup-ghcr-packages.sh
