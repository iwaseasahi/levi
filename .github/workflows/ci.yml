name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://levi:levi@127.0.0.1:5432/levi_test?schema=public
  SHADOW_DATABASE_URL: postgresql://levi:levi@127.0.0.1:5432/levi_shadow?schema=public

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:unit:coverage
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            coverage/
            test-results/*.xml
          if-no-files-found: ignore
          retention-days: 14

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: levi_test
          POSTGRES_PASSWORD: levi
          POSTGRES_USER: levi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U levi -d levi_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create Prisma shadow database
        run: docker exec ${{ job.services.postgres.id }} createdb -U levi levi_shadow
      - run: pnpm db:check
      - run: pnpm test:integration
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: database-reports
          path: test-results/integration.xml
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
