name: Authorize production deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA already merged to main
        required: true
        type: string
      application_image:
        description: Immutable ghcr.io/iwaseasahi/levi@sha256 digest
        required: true
        type: string
      migration_image:
        description: Immutable ghcr.io/iwaseasahi/levi-migrate@sha256 digest
        required: true
        type: string
      approval_comment:
        description: Immediate approval comment URL on a Levi Issue
        required: true
        type: string

permissions:
  contents: read
  checks: read

jobs:
  verify:
    name: Verify immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha }}
      - name: Fail closed on Sunday and validate release inputs
        env:
          APPROVAL_COMMENT: ${{ inputs.approval_comment }}
          APPLICATION_IMAGE: ${{ inputs.application_image }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          MIGRATION_IMAGE: ${{ inputs.migration_image }}
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APPLICATION_IMAGE" =~ ^ghcr\.io/iwaseasahi/levi@sha256:[a-f0-9]{64}$ ]]
          [[ "$MIGRATION_IMAGE" =~ ^ghcr\.io/iwaseasahi/levi-migrate@sha256:[a-f0-9]{64}$ ]]
          [[ "$APPROVAL_COMMENT" =~ ^https://github\.com/iwaseasahi/levi/issues/[0-9]+#issuecomment-[0-9]+$ ]]
          [[ "$(TZ=Asia/Tokyo date +%u)" != "7" ]]
          git fetch --quiet origin main
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main
      - name: Require successful CI for the exact commit
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for required in Quality Database E2E Security; do
            result="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs?per_page=100" --jq "[.check_runs[] | select(.name == \"$required\")] | sort_by(.started_at) | last | [.status, .conclusion] | @tsv")"
            [[ "$result" == $'completed\tsuccess' ]] || { echo "Latest ${required} check is not successful for ${COMMIT_SHA}" >&2; exit 1; }
          done

  authorize:
    name: Authorize approved digest
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Create immutable authorization record
        env:
          APPROVAL_COMMENT: ${{ inputs.approval_comment }}
          APPLICATION_IMAGE: ${{ inputs.application_image }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          MIGRATION_IMAGE: ${{ inputs.migration_image }}
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg application_image "$APPLICATION_IMAGE" \
            --arg migration_image "$MIGRATION_IMAGE" \
            --arg approval_comment "$APPROVAL_COMMENT" \
            --arg authorized_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: 1,
              repository: $repository,
              run_id: $run_id,
              run_attempt: $run_attempt,
              commit_sha: $commit_sha,
              application_image: $application_image,
              migration_image: $migration_image,
              approval_comment: $approval_comment,
              authorized_at: $authorized_at
            }' > production-deploy-authorization.json
      - name: Upload authorization record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-deploy-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-deploy-authorization.json
          if-no-files-found: error
          retention-days: 1
      - name: Record operator handoff
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Production deploy authorized

          GitHub validation and the protected \`production\` Environment approval completed.
          No network connection to the production host was attempted.

          The operator can execute the exact authorization from an allowlisted workstation:

          \`pnpm production:deploy:authorized -- $GITHUB_RUN_ID\`
          EOF
