name: Publish production images
run-name: "Prepare production candidate for ${{ inputs.commit_sha }}"

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA already merged to main with successful CI
        required: true
        type: string

permissions:
  contents: read
  checks: read
  packages: write

jobs:
  publish:
    name: Publish immutable images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha }}
      - name: Verify exact commit and CI
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --quiet origin main
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main
          for required in Quality Database E2E Security; do
            result="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs?per_page=100" --jq "[.check_runs[] | select(.name == \"$required\")] | sort_by(.started_at) | last | [.status, .conclusion] | @tsv")"
            [[ "$result" == $'completed\tsuccess' ]] || { echo "Latest ${required} check is not successful for ${COMMIT_SHA}" >&2; exit 1; }
          done
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and publish application image
        id: application
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.production
          platforms: linux/amd64
          push: true
          tags: ghcr.io/iwaseasahi/levi:${{ inputs.commit_sha }}
          build-args: VCS_REF=${{ inputs.commit_sha }}
          cache-from: type=gha,scope=levi-production-application
          cache-to: type=gha,mode=max,scope=levi-production-application
      - name: Build and publish migration image
        id: migration
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.migrate.production
          platforms: linux/amd64
          push: true
          tags: ghcr.io/iwaseasahi/levi-migrate:${{ inputs.commit_sha }}
          build-args: VCS_REF=${{ inputs.commit_sha }}
          cache-from: type=gha,scope=levi-production-migration
          cache-to: type=gha,mode=max,scope=levi-production-migration
      - name: Create immutable release candidate
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          APPLICATION_DIGEST: ${{ steps.application.outputs.digest }}
          MIGRATION_DIGEST: ${{ steps.migration.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$APPLICATION_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$MIGRATION_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          {
            echo '## Immutable production images'
            echo
            echo "- commit: \`$COMMIT_SHA\`"
            echo "- application: \`ghcr.io/iwaseasahi/levi@$APPLICATION_DIGEST\`"
            echo "- migration: \`ghcr.io/iwaseasahi/levi-migrate@$MIGRATION_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg application_image "ghcr.io/iwaseasahi/levi@$APPLICATION_DIGEST" \
            --arg migration_image "ghcr.io/iwaseasahi/levi-migrate@$MIGRATION_DIGEST" \
            --arg prepared_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: 1,
              repository: $repository,
              run_id: $run_id,
              run_attempt: $run_attempt,
              commit_sha: $commit_sha,
              application_image: $application_image,
              migration_image: $migration_image,
              prepared_at: $prepared_at
            }' > production-release-candidate.json
      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-release-candidate.json
          if-no-files-found: error
          retention-days: 1
