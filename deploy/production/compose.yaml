name: levi-production

x-common: &common
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-file: "3"
      max-size: 10m

services:
  proxy:
    <<: *common
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      LEVI_DOMAIN: ${LEVI_DOMAIN:?LEVI_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_config:/config
      - caddy_data:/data
    networks:
      - edge
      - private
    depends_on:
      app:
        condition: service_healthy
    cpus: 0.50
    mem_limit: 128m
    pids_limit: 100

  app:
    <<: *common
    image: ${LEVI_IMAGE:-levi-production:local}
    build:
      context: ../..
      dockerfile: Dockerfile.production
    user: "1000:1000"
    environment:
      ADMIN_BASIC_AUTH_PASSWORD_HASH: ${ADMIN_BASIC_AUTH_PASSWORD_HASH:?ADMIN_BASIC_AUTH_PASSWORD_HASH is required}
      ADMIN_BASIC_AUTH_USERNAME: ${ADMIN_BASIC_AUTH_USERNAME:?ADMIN_BASIC_AUTH_USERNAME is required}
      BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL:?BETTER_AUTH_BASE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      ADMIN_BETTER_AUTH_SECRET: ${ADMIN_BETTER_AUTH_SECRET:?ADMIN_BETTER_AUTH_SECRET is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:?BETTER_AUTH_TRUSTED_ORIGINS is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NODE_ENV: production
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,uid=1000,gid=1000
    cap_drop:
      - ALL
    networks:
      - private
      - egress
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    cpus: 1.50
    mem_limit: 768m
    pids_limit: 256

  migrate:
    <<: *common
    profiles:
      - migration
    image: ${LEVI_MIGRATION_IMAGE:-levi-migration:local}
    build:
      context: ../..
      dockerfile: Dockerfile.migrate.production
    user: "1000:1000"
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
      NODE_ENV: production
      SHADOW_DATABASE_URL: ${MIGRATION_SHADOW_DATABASE_URL:?MIGRATION_SHADOW_DATABASE_URL is required}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,uid=1000,gid=1000
    cap_drop:
      - ALL
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    cpus: 1.00
    mem_limit: 512m
    pids_limit: 128

  postgres:
    <<: *common
    image: postgres:18.1-alpine3.23@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    environment:
      LEVI_APP_DATABASE_PASSWORD: ${LEVI_APP_DATABASE_PASSWORD:?LEVI_APP_DATABASE_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    read_only: true
    tmpfs:
      - /run/postgresql:size=16m,mode=3775,uid=70,gid=70
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    stop_grace_period: 60s
    cpus: 1.25
    mem_limit: 1536m
    pids_limit: 256

networks:
  edge: {}
  private:
    internal: true
  egress:
    name: levi-production-egress
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-levi-egress
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  caddy_config: {}
  caddy_data: {}
  postgres_data: {}
